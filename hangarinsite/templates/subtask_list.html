{% extends 'base.html' %} {% load static %} {% block content %} 
 <div class="content"> 
   <div class="container-fluid">
     <h4 class="page-title">Task List</h4>  
     <div class="row"> 
       <div class="col-md-12">  
         <div class="card"> 
           <div class="card-header">  
              <div class="card-category">
                <a href="{% url 'task-list' %}"><i class="la la-dashboard"></i><p>Back</p></a>
              </div> 
             <div class="card-title">{{object.parent_task}}</div>  
             <div class="col-md-6">  
                  <div class="pull-right">  
                    <a href="{% url 'task-add' %}" class="btn btn-success btn-rounded">Add Task</a> 
                  </div>  
              </div> 
           </div> 
           <br />
            <div class="col-md-12 row"> 
              <div class="col-md-6"> 
                <form class="navbar-left navbar-form nav-search mr-md-3" action="{% url 'task-list' %}"> 
                  <div class="input-group"> 
                    <input type="hidden" name="sort" value="{{ request.GET.sort }}">
                    
                    <input type="text" placeholder="Search ..." class="form-control" name="q" value="{{ request.GET.q }}" />  
                    <div class="input-group-append"> 
                      <button type="submit" class="input-group-text" style="border:none; background:none;">  
                          <i class="la la-search search-icon"></i>  
                      </button>
                    </div>  
                  </div>  
                </form>  
                </div>  
                
            </div>
            <div class="col-md-12">
              <form method="get" class="row g-2 align-items-center">
                <div class="col-auto">
                  <label for="smallSelect" class="col-form-label">Sort by</label>
                </div>
                <div class="col-auto">
                  <select name="sort_by" id="smallSelect" class="form-control form-control-sm">
                    <option value="title" {% if request.GET.sort_by == 'title' %}selected{% endif %}>Ascending</option>
                    <option value="-created_at" {% if request.GET.sort_by == '-created_at' %}selected{% endif %}>Newest</option>
                    <option value="created_at" {% if request.GET.sort_by == 'created_at' %}selected{% endif %}>Oldest</option>
                  </select>
                 
                </div>
                 <div class="col-auto">
                    <button class="btn btn-primary btn-sm btn-rounded">Sort</button>
                  </div>
              </form>
            </div>
           <div class="card-body">  
             <table class="table table-striped mt-3">  
               <thead> 
                 <tr>  
                   <th scope="col">Content</th>
                   <th scope="col">...</th>
                 </tr> 
               </thead>  
               <tbody> 
                 {% for object in object_list %}  
                    <tr> 
                        <td>{{ object.content }}</td>   
                        <td>
                          <a href="task_list/{{ object.id }}">Edit</a>
                          <a href="task_list/{{ object.id }}/delete">Delete</a>
                        </td>
                    </tr> 
                 {% empty %}
                 <tr>
                    <td colspan="4" style="text-align:center">
                        <p class="text-sm font-weight-bold mb-0">No Records Found</p>
                    </td>
                 </tr>
                 {% endfor %}  
               </tbody>  
             </table> 
             {% include 'includes/pagination.html' %}  
           </div>  
         </div>  
       </div>  
     </div>  
   </div>  
 </div> 
{% endblock %}
