{% extends 'base.html' %} {% load static %} {% block content %} 
 <div class="content"> 
   <div class="container-fluid"> 
     <h4 class="page-title">Note</h4> 
     <div class="row">
       <div class="col-md-12">  
         <div class="card"> 
           <div class="card-header"> 
             <div class="card-title">{% if object %}Update Note {% else %} Add New  
Note {% endif %}</div> 
             <!-- <div class="card-category">Page Subtitle</div>  -->
           </div> 
 
           <div class="col-md-6">  
           <div class="card-body"> 
             <form class="" action="" method="post" novalidate> 
               {% csrf_token %} 
               {% if form.errors %}
                  <div class="alert alert-danger" style="background-color: #f8d7da; color: #721c24; padding: 15px; margin-bottom: 20px; border: 1px solid #f5c6cb; border-radius: 4px;">
                    <strong>Please correct the following:</strong>
                    {{ form.errors }}
                  </div>
                {% endif %}
               {% include 'includes/form.html' %} 
                 <div class="form-group"> 
                   <div class="col-md-12 col-sm-3"> 
                     <button type="submit" class="btn btn-primary btn-rounded">Done</button> 
 
                   </div> 
                 </div>  
               </div>  
             </form>  
           </div>  
         </div>  
         </div>  
       </div>  
     </div>  
   </div>  
 </div>  
 {% endblock %}
