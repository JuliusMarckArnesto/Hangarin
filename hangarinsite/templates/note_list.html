{% extends 'base.html' %} {% load static %} {% block content %} 
 <div class="content"> 
   <div class="container-fluid">
     <h4 class="page-title">Home</h4>  
     <div class="row"> 
       <div class="col-md-12">  
         <div class="card"> 
           <div class="card-header">  
             <div class="card-title">Note List</div>  
             <!-- <div class="card-category">Page Subtitle</div>  -->
           </div> 
           <br />
            <div class="col-md-12 row"> 
              <div class="col-md-6"> 
                <form class="navbar-left navbar-form nav-search mr-md-3" action="{% url 'note-list' %}"> 
                  <div class="input-group"> 
                    <input type="text" placeholder="Search ..." class="form-control" name="q"  />  
                    <div class="input-group-append"> 
                      <button type="submit" class="input-group-text" style="border:none; background:none;">  
                          <i class="la la-search search-icon"></i>  
                      </button>
                    </div>  
                  </div>  
                </form>  
                </div>  
                <div class="col-md-6">  
                  <div class="pull-right">  
                    <a href="{% url 'note-add' %}" class="btn btn-success btn-rounded">Add Note</a> 
                  </div>  
              </div> 
            </div>
           <div class="card-body">  
             <table class="table table-striped mt-3">  
               <thead> 
                 <tr>  
                   <th scope="col">Task</th>  
                   <th scope="col">Content</th>  
                   <th scope="col">...</th>
                 </tr> 
               </thead>  
               <tbody> 
                 {% for object in object_list %}  
                    <tr> 
                        <td>{{ object.task }}</td>  
                        <td>{{ object.content }}</td>  
                        <td>
                          <a href="note_list/{{ object.id }}">Edit</a>
                          <a href="note_list/{{ object.id }}/delete">Delete</a>
                        </td>
                    </tr> 

                  
                 {% empty %}
                 <tr>
                    <td colspan="4" style="text-align:center">
                        <p class="text-sm font-weight-bold mb-0">No Records Found</p>
                    </td>
                 </tr>
                 {% endfor %}  
               </tbody>  
             </table> 
             {% include 'includes/pagination.html' %}  
           </div>  
         </div>  
       </div>  
     </div>  
   </div>  
 </div> 
{% endblock %}
