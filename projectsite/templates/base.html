{% load static %}
<!DOCTYPE html>
<html>
<head>
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
	<title>{% block title %}PSUSphere{% endblock %}</title>
	<meta content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, shrink-to-fit=no' name='viewport' />
	<link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
	<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i">
	<link rel="stylesheet" href="{% static 'css/ready.css' %}">
	<link rel="stylesheet" href="{% static 'css/demo.css' %}">
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">
</head>
<body>
	<div class="wrapper">
		<div class="main-header">
			<div class="logo-header">
				<a href="#" class="logo">
					Hangarin
				</a>	
				<button class="navbar-toggler sidenav-toggler ml-auto" type="button" data-toggle="collapse tooltip" data-placement="right" title="Tooltip on right" data-target="collapse" aria-controls="sidebar" aria-expanded="false" aria-label="Toggle navigation">
					<span class="navbar-toggler-icon"></span>
				</button>
				<button class="topbar-toggler more"><i class="la la-ellipsis-v"></i></button>
			</div>
            <nav class="navbar navbar-header navbar-expand-lg">
				<div class="container-fluid">
                    <ul class="navbar-nav topbar-nav ml-md-auto align-items-center">
                        <li class="nav-item d-flex align-items-center mr-2">
                            <button id="dark-mode-toggle" title="Toggle dark mode">
                                <span class="toggle-icon" id="toggle-icon"><i class="la la-adjust"></i></span>
                                <span id="toggle-label">Dark</span>
                            </button>
                        </li>
                        <li class="nav-item dropdown">
                            <span>{{request.user.username}}</span>
                            <a class="dropdown-toggle profile-pic" data-toggle="dropdown" href="#" aria-expanded="false"> 
                                <!--<img src="{% static 'img/profile.jpg' %}" alt="user-img" width="36" class="img-circle">-->
                                <!-- <span>{{request.user.username}}</span> -->
                            </a>
                            <ul class="dropdown-menu dropdown-user">
                            <li>
                                <div class="user-box">
                                    <!-- <div class="u-img"><img src="{% static 'img/profile.jpg' %}" alt="user"></div> -->
                                    <div class="u-text">
                                        <h4>{{request.user.username}}</h4>
                                        <p class="text-muted">
                                            {% if user.email %}
                                                {{ user.email }}
                                            {% else %}
                                                No email provided
                                            {% endif %}
                                        </p>
                                        <!-- <a href="profile.html" class="btn btn-rounded btn-danger btn-sm">View Profile</a></div>
                                    </div>
                                </li>
                                <div class="dropdown-divider"></div>
                                <a class="dropdown-item" href="#"><i class="ti-user"></i> My Profile</a>
                                <a class="dropdown-item" href="#"></i> My Balance</a>
                                <a class="dropdown-item" href="#"><i class="ti-email"></i> Inbox</a>
                                <div class="dropdown-divider"></div>
                                <a class="dropdown-item" href="#"><i class="ti-settings"></i> Account Setting</a>
                                <div class="dropdown-divider"></div> -->
                                <a class="dropdown-item" href="{% url 'account_logout' %}"><i class="fa fa-power-off"></i> Logout</a>
                            </ul>
                        </li>
                    </ul>
                </div>
            </nav>

        </div>
        <div class="sidebar">
            <div class="scrollbar-inner sidebar-wrapper">
                <div class="user">
                    <div class="info">
                        <a class="" data-toggle="collapse" href="#" aria-expanded="true">
                            <span>
                                <h4><strong>Menu</strong></h4>
                            </span>
                        </a>
                    </div>
                </div>
                <ul class="nav">
                    <li class="nav-item {% if request.resolver_match.url_name == 'task-list' %}active{% endif %}">
                        <a href="{% url 'task-list' %}">
                            <i class="la la-list"></i>
                            <p>Tasks</p>
                        </a>
                    </li>
                    <li class="nav-item {% if request.resolver_match.url_name == 'note-list' %}active{% endif %}">
                        <a href="{% url 'note-list' %}">
                            <i class="la la-sticky-note"></i>
                            <p>Notes</p>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
        <div class="main-panel">
            {% block content %}
            {% endblock %}
        </div>
    </div>
</body>
<script src="{% static 'js/core/jquery.3.2.1.min.js' %}"></script>
<script src="{% static 'js/plugin/jquery-ui-1.12.1.custom/jquery-ui.min.js' %}"></script>
<script src="{% static 'js/core/popper.min.js' %}"></script>
<script src="{% static 'js/core/bootstrap.min.js' %}"></script>
<script src="{% static 'js/plugin/chartist/chartist.min.js' %}"></script>
<script src="{% static 'js/plugin/chartist/plugin/chartist-plugin-tooltip.min.js' %}"></script>
<script src="{% static 'js/plugin/bootstrap-notify/bootstrap-notify.min.js' %}"></script>
<script src="{% static 'js/plugin/bootstrap-toggle/bootstrap-toggle.min.js' %}"></script>
<script src="{% static 'js/plugin/jquery-mapael/jquery.mapael.min.js' %}"></script>
<script src="{% static 'js/plugin/jquery-mapael/maps/world_countries.min.js' %}"></script>
<script src="{% static 'js/plugin/chart-circle/circles.min.js' %}"></script>
<script src="{% static 'js/plugin/jquery-scrollbar/jquery.scrollbar.min.js' %}"></script>
<script src="{% static 'js/ready.min.js' %}"></script>
<script>
  (function () {
    const body     = document.body;
    const btn      = document.getElementById('dark-mode-toggle');
    const icon     = document.getElementById('toggle-icon');
    const label    = document.getElementById('toggle-label');
    const STORAGE_KEY = 'hangarin-dark-mode';

    function setDark(isDark) {
      body.classList.toggle('dark-mode', isDark);
      icon.innerHTML = isDark ? '<i class="la la-circle"></i>' : '<i class="la la-adjust"></i>';
      label.textContent = isDark ? 'Light' : 'Dark';
      localStorage.setItem(STORAGE_KEY, isDark ? '1' : '0');
    }

    // Restore saved preference on load
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved === '1') setDark(true);

    // Button click
    btn.addEventListener('click', function () {
      setDark(!body.classList.contains('dark-mode'));
    });
  })();
</script>
</html>
